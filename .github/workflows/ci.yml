name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default; each job widens only what it needs.
permissions: {}

# Every `run:` step goes through bash with pipefail, which `shell: bash` spells `bash --noprofile --norc -eo pipefail`.
# Without it the runner uses `bash -e`, and a failing command early in a pipe is masked by the last one.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled, but pushes to main queue instead: a
  # cancelled main run deploys nothing, and if the newer run then fails, Pages
  # would be left without a successful deploy for either commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build & check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout only; no write access needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history so gitleaks scans every commit rather than just the shallow HEAD snapshot
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          # No `cache: npm` on purpose, because setup-node saves its cache on every run and restores exact keys only.
          # Renovate rewrites the lockfile on nearly every branch, so each PR would save an entry no other run can read.
          # The npm cache steps around `npm ci` below restore on every run and save from main only.
      - name: Install npm pinned in engines.npm
        # zizmor: ignore[adhoc-packages] npm itself has no lockfile; pinned to engines.npm
        run: npm install -g "npm@$(node -p 'require("./package.json").engines.npm')"
      - name: Install opengrep
        env:
          # keep in sync with OPENGREP_VERSION in .devcontainer/Dockerfile
          # renovate: datasource=github-releases depName=opengrep packageName=opengrep/opengrep
          OPENGREP_VERSION: 2.0.0
        # Download the pinned release binary directly instead of using install.sh:
        # the installer lists releases via the unauthenticated GitHub API, which
        # gets rate-limited on shared runners (HTTP 403 -> "Failed to fetch
        # available versions from GitHub").
        run: |
          install_dir="$HOME/.opengrep/cli/latest"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            -o "$install_dir/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_linux_x86"
          chmod +x "$install_dir/opengrep"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/opengrep" --version
      - name: Install gitleaks
        env:
          # keep in sync with GITLEAKS_VERSION in .devcontainer/Dockerfile
          # renovate: datasource=github-releases depName=gitleaks packageName=gitleaks/gitleaks
          GITLEAKS_VERSION: 8.30.1
        run: |
          install_dir="$HOME/.gitleaks/bin"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version
      - name: Install zizmor
        env:
          # keep in sync with ZIZMOR_VERSION in .devcontainer/Dockerfile
          # renovate: datasource=github-releases depName=zizmor packageName=zizmorcore/zizmor
          ZIZMOR_VERSION: 1.33.1
        run: |
          install_dir="$HOME/.zizmor/bin"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$install_dir" zizmor
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/zizmor" --version
      - name: Install shellcheck
        # The runner image ships its own shellcheck, whose version moves with the image.
        # GITHUB_PATH entries come first on PATH, so this pinned binary shadows it for later steps.
        env:
          # keep in sync with SHELLCHECK_VERSION in .devcontainer/Dockerfile
          # renovate: datasource=github-releases depName=shellcheck packageName=koalaman/shellcheck
          SHELLCHECK_VERSION: 0.11.0
        run: |
          install_dir="$HOME/.shellcheck/bin"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$install_dir" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/shellcheck" --version
      - name: Install actionlint
        env:
          # keep in sync with ACTIONLINT_VERSION in .devcontainer/Dockerfile
          # renovate: datasource=github-releases depName=actionlint packageName=rhysd/actionlint
          ACTIONLINT_VERSION: 1.7.12
        run: |
          install_dir="$HOME/.actionlint/bin"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/actionlint" --version
      - name: Install trivy
        env:
          # keep in sync with TRIVY_VERSION in .devcontainer/Dockerfile
          # renovate: datasource=github-releases depName=trivy packageName=aquasecurity/trivy
          TRIVY_VERSION: 0.76.2
        run: |
          install_dir="$HOME/.trivy/bin"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$install_dir" trivy
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/trivy" --version
      - name: Install hadolint
        env:
          # keep in sync with HADOLINT_VERSION in .devcontainer/Dockerfile
          # renovate: datasource=github-releases depName=hadolint packageName=hadolint/hadolint
          HADOLINT_VERSION: 2.15.1
        run: |
          install_dir="$HOME/.hadolint/bin"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64" \
            -o "$install_dir/hadolint"
          chmod +x "$install_dir/hadolint"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/hadolint" --version
      # Every cache below is restored on every run but saved only by pushes to main.
      # A cache saved by a pull request run is scoped to that PR's merge ref, so no other run can ever restore it.
      # Saving from main alone keeps one current entry per cache that every PR can read.
      # It also means no pull request can plant content in a cache that main later restores.
      - name: Cache key dates
        id: cache-dates
        # The Trivy vuln DB refreshes about daily upstream, so its key carries the date.
        # The npm cache key carries the month, so its content starts fresh once a month instead of growing for good.
        run: |
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
          echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore trivy data (vuln DB + misconfig checks)
        id: trivy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ steps.cache-dates.outputs.date }}
          # A new day warm-starts from the newest DB main saved, so trivy only fetches the update.
          # That avoids a full re-download and the GHCR rate limits that come with it.
          restore-keys: |
            trivy-${{ runner.os }}-
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ steps.cache-dates.outputs.month }}-${{ hashFiles('package-lock.json') }}
          # A Renovate branch rarely matches main's lockfile exactly.
          # The prefix restores main's newest cache this month, so npm ci only downloads what the branch changed.
          restore-keys: |
            npm-${{ runner.os }}-${{ steps.cache-dates.outputs.month }}-
      - run: npm ci
      - name: Save npm download cache
        # Saved right after npm ci, before any later step writes to ~/.npm.
        # npm audit signatures caches attestation responses there, including the bad "OK" bodies the registry
        # sometimes sends, and the renovate validator's npx install would add a whole second dependency tree.
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Verify registry signatures and provenance
        # The attestations endpoint sometimes answers a single request with a bare "OK" instead of JSON.
        # npm then aborts the whole audit with FETCH_ERROR before it has verified anything.
        # Only that error is retried, so a real signature or provenance mismatch still fails on the first attempt.
        run: |
          for attempt in 1 2 3; do
            if npm audit signatures 2>&1 | tee "$RUNNER_TEMP/audit.log"; then
              exit 0
            fi
            if ! grep -q 'code FETCH_ERROR' "$RUNNER_TEMP/audit.log"; then
              exit 1
            fi
            echo "::warning::npm audit signatures hit a registry fetch error, attempt $attempt of 3"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Decide whether the renovate config needs validating
        id: renovate-config
        env:
          # Empty for events that carry no diff base, which the script below treats as "validate anyway".
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The validator npx-installs renovate, which costs about 25 s on every run.
          # Only renovate.jsonc and the validator pin in package.json can invalidate the result, so skip it otherwise.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nearly every dependency update touches package.json, so -G narrows that file to lines naming the pin.
          # --quiet exits 0 only when nothing relevant differs, so a git error also lands on "validate".
          if git diff --quiet "${BASE_SHA}...HEAD" -- renovate.jsonc \
            && git diff --quiet -G'renovate@[0-9]' "${BASE_SHA}...HEAD" -- package.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate renovate config
        if: steps.renovate-config.outputs.changed == 'true'
        run: npm run renovate:validate
      - run: npm run check:code
      - name: Lint workflows
        # Same npm script the pre-commit hook runs, so CI and local use one
        # source of truth. Kept out of check:code to match the hook's scope:
        # workflows are linted when they change, not on every push.
        run: npm run scan:workflows
      - name: Generate SBOM (CycloneDX)
        run: npm run sbom
      - name: Upload SBOM
        # Only main's SBOM describes something that is actually deployed.
        # PR runs still generate it above, which keeps a broken sbom config from reaching main, but they were storing
        # a throwaway artifact per run.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 3 # the repo-wide maximum; higher values are silently clamped to it
      - name: Scan Dockerfile base image for OS CVEs
        # `scan:image` reads the pinned FROM image out of the Dockerfile, which is a single stage with a literal ref.
        # CI and local runs therefore scan the same base and never drift from the digest Renovate bumps there.
        # This runs in this job rather than a separate one, to reuse the trivy binary and warm vuln DB.
        run: npm run scan:image
      - name: Save trivy data
        # Saved after scan:image, the last step that updates the DB.
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.trivy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: ${{ steps.trivy-cache.outputs.cache-primary-key }}
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Playwright version rather than the whole lockfile, so unrelated dependency bumps don't
          # re-download browsers.
          # A Playwright update PR downloads its browsers on each run, and main saves them once it is merged.
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install-deps chromium
      - run: npx playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Save Playwright browsers
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - run: npm run check:build
      - name: Upload Playwright traces (failures and flaky retries)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 3 # the repo-wide maximum; higher values are silently clamped to it
      - name: Build for deploy
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env:
          DEPLOY_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Upload dist
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to Pages
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # peaceiris/actions-gh-pages pushes the built site to the gh-pages branch
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
