name: Mutation testing

# Manual trigger only.
# A full run takes several minutes of runner time, which a schedule or every push would spend for little gain here.
on:
  workflow_dispatch:

permissions: {}

# Every `run:` step goes through bash with pipefail, which `shell: bash` spells `bash --noprofile --norc -eo pipefail`.
# Without it the runner uses `bash -e`, and a failing command early in a pipe is masked by the last one.
defaults:
  run:
    shell: bash

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Stryker on src/lib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Install npm pinned in engines.npm
        # zizmor: ignore[adhoc-packages] npm itself has no lockfile; pinned to engines.npm
        run: npm install -g "npm@$(node -p 'require("./package.json").engines.npm')"
      - run: npm ci
      - name: Verify registry signatures and provenance
        run: npm audit signatures
      - run: npm run test:mutation
      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          if-no-files-found: ignore
          retention-days: 3 # the repo-wide maximum; higher values are silently clamped to it
