# Ignore rules for the "scan:image" npm script, referenced by the "ignorefile" key in image.yaml.
# Every entry carries an expiry date.
# An exception that outlives its expiry starts failing the scan again instead of hiding the finding forever.
# The expiry key is expired_at with an underscore.
# Trivy silently accepts an unknown key, so a misspelling turns the entry into a permanent exception.
#
# Every block below has the same root cause, so they share one expiry.
# The pinned debian:trixie-slim was built on 24 August 2026 and no newer build has been published since.
# trixie-20260824 is still the newest dated tag, and the floating trixie-slim tag resolves to that same root filesystem.
# Debian has published all of these fixes in trixie-security, so nothing here is actionable from this repo.
# A digest bump cannot clear any of them, because there is no rebuilt image to bump to.
# Renovate bumps the FROM digest in .devcontainer/Dockerfile once the image is rebuilt.
# Each block then clears at once, because a single fixed version covers every CVE in it.
#
# The expiry follows the published policy of debuerreotype/docker-debian-artifacts, which builds these images.
# Its "Update Frequency" section promises a build at least once a month, and sooner for a Debian point release
# or for a severe security issue.
# See https://github.com/debuerreotype/docker-debian-artifacts#update-frequency
# That puts the next build due by 23 September, and Debian 13.7 on 12 September should have prompted an earlier one.
# The expiry below is that due date plus a week of grace.
#
# All of this sits in the container used for development.
# None of it reaches the deployed artifact, which is a static PWA.

vulnerabilities:
  # glibc, installed 2.41-12+deb13u3, fixed in 2.41-12+deb13u4.
  # Reported against both libc-bin and libc6, and both are MEDIUM.
  - id: CVE-2026-5450
    expired_at: 2026-09-30
  - id: CVE-2026-5928
    expired_at: 2026-09-30

  # gzip, installed 1.13-1, fixed in 1.13-1+deb13u1.
  # The HIGH one needs an attacker-supplied LZH archive, and the other needs gzexe, which nothing here runs.
  - id: CVE-2026-41991
    expired_at: 2026-09-30
  - id: CVE-2026-41992
    expired_at: 2026-09-30

  # openssl, installed 3.5.6-1~deb13u2, fixed in 3.5.7-1~deb13u2.
  # Reported against both libssl3t64 and openssl-provider-legacy.
  # curl is the consumer that matters, because Node bundles its own openssl and the Go tools carry their own TLS.
  # Only CVE-2026-14456 is HIGH, and it needs a QUIC peer.
  # This curl is built with HTTP3, so that is reachable in principle, and nothing in this repo passes --http3.
  # Triggering it takes a deliberate HTTP/3 request against a hostile endpoint.
  - id: CVE-2026-14456
