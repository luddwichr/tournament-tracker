# Ignore rules for the "scan:image" npm script, referenced by the "ignorefile" key in image.yaml.
# Every entry carries an expiry date.
# An exception that outlives its expiry starts failing the scan again instead of hiding the finding forever.
# The expiry key is expired_at with an underscore.
# Trivy silently accepts an unknown key, so a misspelling turns the entry into a permanent exception.
#
# The list is empty while the pinned base image has no fixed-but-unpatched findings.
# Prefer bumping the FROM digest in .devcontainer/Dockerfile to adding an entry here.
# Add one only when Debian has published a fix that no rebuilt image carries yet.
# Its comment names the package, the installed and fixed versions, and why the finding is not reachable here.
#
# Example entry:
#   - id: CVE-2026-12345
#     expired_at: 2026-12-31

vulnerabilities: []
