# Ignore rules for the "scan:image" npm script, referenced by the "ignorefile" key in image.yaml.
# Every entry carries an expiry date.
# An exception that outlives its expiry starts failing the scan again instead of hiding the finding forever.
# The expiry key is expired_at with an underscore.
# Trivy silently accepts an unknown key, so a misspelling turns the entry into a permanent exception.

vulnerabilities:
  # openssl in the pinned devcontainer base image.
  # Debian has published the fix as 3.5.7-1~deb13u2, but no debian:trixie-slim build ships it yet.
  # The 24 August rebuild pinned in the Dockerfile still carries 3.5.6-1~deb13u2, so a digest bump does not clear these.
  # Nothing here is actionable from this repo until the Docker official image is rebuilt with that update.
  # Renovate then bumps the FROM digest in .devcontainer/Dockerfile and all ten clear at once,
  # because one openssl version fixes every one of them.
  # The debian entry in docker-library/official-images refreshes roughly every three weeks.
  # The last two refreshes landed on 3 and 24 August 2026, so the expiry below is the next expected one plus a week.
  # Only CVE-2026-14456 is HIGH, and it needs a QUIC server.
  # These affect TLS libraries in the container used for development.
  # They do not reach the deployed artifact, which is a static PWA.
  - id: CVE-2026-14456
    expired_at: 2026-09-21
  - id: CVE-2026-14457
    expired_at: 2026-09-21
  - id: CVE-2026-18798
    expired_at: 2026-09-21
  - id: CVE-2026-54874
    expired_at: 2026-09-21
  - id: CVE-2026-63072
    expired_at: 2026-09-21
  - id: CVE-2026-63073
    expired_at: 2026-09-21
  - id: CVE-2026-63074
    expired_at: 2026-09-21
  - id: CVE-2026-63075
    expired_at: 2026-09-21
  - id: CVE-2026-63076
    expired_at: 2026-09-21
  - id: CVE-2026-75803
    expired_at: 2026-09-21
